<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRANDLAND</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #07111f, #102a43);
    color: white;
    display: flex;
    justify-content: center;f   align-items: center;
    padding: 20px;
}

.panel {
    width: 100%;
    max-width: 500px;
    background: rgba(10, 18, 30, 0.95);
    border: 1px solid #29445f;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
}

h1 {
    font-size: 42px;
    letter-spacing: 4px;
    margin-bottom: 8px;
}

.subtitle {
    color: #9fb3c8;
    margin-bottom: 30px;
}

.status {
    background: #101f2e;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
}

.dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    background: #ff3b30;
    border-radius: 50%;
    margin-right: 8px;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #27c93f;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
}

button:hover {
    background: #20ad35;
}

.info {
    text-align: left;
    background: #0b1724;
    border-radius: 12px;
    padding: 18px;
    line-height: 1.8;
}

.label {
    color: #8fa8bf;
}

.value {
    font-weight: bold;
}

footer {
    margin-top: 25px;
    color: #657b91;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="panel">

    <h1>🎮 BRANDLAND</h1>
    <p class="subtitle">Servidor oficial</p>

    <div class="status">
        <span class="dot"></span>
        <strong>Servidor apagado</strong>
    </div>

   <button id="activarBtn" onclick="activarServidor()">
    🚀 ACTIVAR SERVIDOR
</button>
    <div class="info">
        <div>
            <span class="label">Servidor:</span>
            <span class="value">brandland</span>
        </div>

        <div>
            <span class="label">Bedrock:</span>
            <span class="value">bedrock.minehut.com</span>
        </div>

        <div>
            <span class="label">Puerto:</span>
            <span class="value">19132</span>
        </div>

        <div>
            <span class="value" id="jugadores">0 / 10</span>
        </div>
    </div>

    <footer>
        BRANDLAND • Minecraft Server
    </footer>

</div>

<script>
function activarServidor() {
    const boton = document.getElementById("activarBtn");
    const estado = document.querySelector(".status strong");
    const punto = document.querySelector(".status .dot");

    boton.disabled = true;
    boton.innerHTML = "⏳ ABRIENDO MINEHUT...";

    estado.innerHTML = "Servidor iniciando...";
    punto.style.background = "#ffd000";

    window.open("https://minehut.com/", "_blank");

    setTimeout(() => {
        boton.disabled = false;
        boton.innerHTML = "🚀 ACTIVAR SERVIDOR";
    }, 3000);
}
</script>

</body>
</html>
